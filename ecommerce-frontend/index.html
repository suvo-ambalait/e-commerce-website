<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- brand icons live in public/AmbalaEshop-logo -->
    <link rel="icon" href="/AmbalaEshop-logo/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/AmbalaEshop-logo/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/AmbalaEshop-logo/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/AmbalaEshop-logo/apple-touch-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfaf7" />
    <meta property="og:image" content="/AmbalaEshop-logo/logo-color.png" />
    <meta
      name="description"
      content="AmbalaEshop — online shopping in Bangladesh. Buy from trusted local shops in one cart. Cash on delivery, bKash and Nagad accepted."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400..800&text=%E0%A7%B3&display=swap"
      rel="stylesheet"
    />
    <title>AmbalaEshop — Online shopping in Bangladesh</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
